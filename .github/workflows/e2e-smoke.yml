name: E2E Smoke

# Minimal browser smoke on top of ci.yml: mounts the React demo and exercises
# the editing pipeline (rendering, typing, formatting, comments sidebar).
# The full ~460-test suite stays local/on-demand — see AGENTS.md "Verify".
#
# Playwright starts the React dev server itself (playwright.config.ts
# webServer), so no extra server step is needed here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run e2e smoke
        run: |
          bunx playwright test \
            --project=chromium \
            --timeout=60000 \
            e2e/tests/formatting.spec.ts \
            e2e/tests/text-editing.spec.ts \
            e2e/tests/comments-sidebar.spec.ts
